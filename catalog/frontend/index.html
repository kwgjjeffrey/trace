<!doctype html><html lang="en"><meta charset="utf-8"><title>Trace</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;height:100vh;font:14px system-ui;background:#101827;color:#e5edf8}main{display:grid;grid-template-columns:clamp(260px,27vw,400px) minmax(0,1fr);height:100vh}.catalog{overflow:auto;border-right:1px solid #34475f;padding:16px}h1{font-size:20px;margin:4px 8px 18px}.operation{display:block;width:100%;text-align:left;background:transparent;color:inherit;border:1px solid #34475f;border-radius:8px;padding:16px;margin:0 0 12px;cursor:pointer}.operation:hover{background:#17263b}.operation[aria-pressed=true]{background:#20344c;border-color:#7dd3fc}.name{display:block;font-weight:600;color:#7dd3fc;overflow-wrap:anywhere}.description{display:block;line-height:1.6;margin:10px 0}.path{display:block;color:#9bacc2;font:12px ui-monospace,monospace;overflow-wrap:anywhere}.statistics{display:block;font-size:12px;color:#cbd7e8;margin-top:12px}.viewer{display:flex;flex-direction:column;min-width:0;min-height:0}.header{padding:16px 20px;border-bottom:1px solid #34475f;display:flex;gap:16px;align-items:center;justify-content:space-between}.header code{overflow-wrap:anywhere}.header a{color:#7dd3fc;white-space:nowrap}#gui{width:100%;flex:1;min-height:0;border:0}#command{margin:0;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto}#notice{padding:10px 20px;margin:0;font-size:12px;color:#9bacc2}a{color:#7dd3fc}
</style><main><aside class="catalog"><h1 id="title">Trace</h1><div id="entries"></div></aside><section class="viewer"><header class="header" id="header" hidden><code id="source"></code><a id="grafana" target="_blank" rel="noreferrer" hidden>Grafana ↗</a></header><p id="notice" role="status" hidden></p><iframe id="gui" hidden title="Operation preview"></iframe><pre id="command" hidden></pre></section></main><script type="module" src="/view.bundle.js"></script></html>
